<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="buddy.css">
</head>
<body>
  <div id="buddy" class="buddy">
    <button id="shiba" class="shiba" title="Notchman: select text, then click. Drag to move." aria-label="Notchman">
      <span id="shibaArt"></span>
    </button>
    <div id="menu" class="menu" role="menu">
      <button id="tldr" class="item" role="menuitem"><i data-icon="tldr"></i><span class="label">TL;DR</span><span class="hint" id="tldrKey">Alt+T</span></button>
      <button id="read" class="item" role="menuitem"><i data-icon="read"></i><span class="label">Read aloud</span><span class="hint" id="readKey">Alt+R</span></button>
      <button id="pick" class="item" role="menuitem"><i data-icon="pick"></i><span class="label">Pick on screen</span><span class="tag pro">Pro</span></button>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="shiba.js"></script>
  <script src="buddy.js"></script>
</body>
</html>
