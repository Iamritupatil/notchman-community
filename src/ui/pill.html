<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="pill.css">
</head>
<body>
  <div id="pill" class="pill hidden">
    <img class="mascot" src="../../assets/shiba-face.png" alt="">
    <div class="middle">
      <div class="title" id="title">Notchman</div>
      <div class="status" id="status"></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
    <div class="controls" id="controls">
      <button id="back" title="Back 15 seconds" aria-label="Back 15 seconds"><i data-icon="back"></i><span class="n">15</span></button>
      <button id="playPause" class="main" title="Pause" aria-label="Pause"><span id="iconPause"><i data-icon="pause"></i></span><span id="iconPlay" class="gone"><i data-icon="play"></i></span></button>
      <button id="forward" title="Forward 15 seconds" aria-label="Forward 15 seconds"><i data-icon="forward"></i><span class="n">15</span></button>
      <button id="speed" class="text" title="Speed">1×</button>
      <button id="original" class="text" title="Read the full original">Full text</button>
      <button id="stop" title="Close" aria-label="Close"><i data-icon="close"></i></button>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="pill.js"></script>
</body>
</html>
